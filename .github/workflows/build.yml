name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Existing release tag to upload built assets to (optional; leave empty to just upload workflow artifacts)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      # Tag pushes (v*) publish installers directly to a GitHub Release matching the tag.
      - name: Package and publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Manual runs (workflow_dispatch) only package and upload as workflow artifacts,
      # so the build can be verified without touching any GitHub Release.
      - name: Package (artifacts only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --publish never

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: hugging-loader-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore

      # Optional: attach this run's installers to an already-existing release (identified by
      # tag) without cutting a new version. Runs entirely on GitHub's infra, so it's the way
      # to backfill assets onto a release when the operator's local connection is too slow/
      # unreliable to round-trip large build artifacts through their own machine.
      - name: Upload to existing release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.upload_to_release != '' }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.exe dist/*.AppImage dist/*.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release-worthy build outputs found for this platform, skipping upload."
            exit 0
          fi
          gh release upload "${{ inputs.upload_to_release }}" "${files[@]}" --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
