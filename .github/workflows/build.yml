name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Existing release tag to upload built assets to (optional; leave empty to just upload workflow artifacts)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Tag pushes (v*) publish installers directly to a GitHub Release matching the tag.
      - name: Package and publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false

      # Manual runs (workflow_dispatch) without an existing-release target only package and
      # upload as workflow artifacts, so the build can be verified without touching any
      # GitHub Release. Omitting tagName/releaseName/releaseId is tauri-action's documented
      # way to build without uploading anything to a release.
      - name: Package (artifacts only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.upload_to_release == '' }}
        uses: tauri-apps/tauri-action@v1
        with:
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: 'hugging-loader-[platform]-[arch]-[bundle]'

      # Optional: attach this run's installers to an already-existing release (identified by
      # tag) without cutting a new version. Runs entirely on GitHub's infra, so it's the way
      # to backfill assets onto a release when the operator's local connection is too slow/
      # unreliable to round-trip large build artifacts through their own machine.
      - name: Upload to existing release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.upload_to_release != '' }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.upload_to_release }}
