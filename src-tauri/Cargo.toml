[package]
name = "app"
version = "0.1.0"
description = "Browse and download GGUF models from Hugging Face Hub for use with llama.cpp"
authors = ["7thCode"]
license = ""
repository = "https://github.com/7thCode/hugging-loader"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.3"
tokio = { version = "1.53.1", features = ["sync"] }
