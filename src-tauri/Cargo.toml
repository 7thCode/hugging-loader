[package]
name = "app"
version = "0.1.0"
description = "Browse and download GGUF models from Hugging Face Hub for use with llama.cpp"
authors = ["7thCode"]
license = ""
repository = "https://github.com/7thCode/hugging-loader"
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.3"
tokio = { version = "1.53.1", features = ["fs", "macros", "sync"] }
regex = "1.13.1"
url = "2.5.8"
path-clean = "1.0.1"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "stream"] }
uuid = { version = "1.26.1", features = ["v4"] }
percent-encoding = "2.3.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tokio-util = "0.7.19"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
wiremock = "0.6.5"
